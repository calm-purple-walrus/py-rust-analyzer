[package]
name = "py-rust-analyzer"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
description = "Python bindings of rust-analyzer's library crates"
publish = false

# A workspace of its own, so that it is never a member of a workspace it sits in.
[workspace]
resolver = "3"

[lib]
name = "rust_analyzer"
crate-type = ["cdylib"]

# rust-analyzer 0.0.352 is the version that Rust 1.100.0 ships.
[dependencies]
either = "1"
pyo3 = { version = "0.30", features = ["extension-module", "multiple-pymethods"] }
ra_ap_cfg = "=0.0.352"
ra_ap_hir = "=0.0.352"
ra_ap_hir_expand = "=0.0.352"
ra_ap_hir_ty = "=0.0.352"
ra_ap_ide_db = "=0.0.352"
ra_ap_load-cargo = "=0.0.352"
ra_ap_paths = "=0.0.352"
ra_ap_proc_macro_api = "=0.0.352"
ra_ap_project_model = "=0.0.352"
ra_ap_syntax = "=0.0.352"
ra_ap_vfs = "=0.0.352"
smallvec = "1"
